app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KC_URL}
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${OAUTH_REDIRECT_URI}
            scope: openid, profile, email
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: bazar-space-service
              uri: ${BAZAR_AUTHORIZATION_URL}
              predicates:
                - Path=/bazar-authorization/**
              filters:
                - StripPrefix=1
                - PrefixPath=/api
            - id: bazar-space-service
              uri: ${BAZAR_SPACE_URL}
              predicates:
                - Path=/bazar-space/**
              filters:
                - StripPrefix=1
                - PrefixPath=/api
            - id: bazar-persona
              uri: ${BAZAR_PERSONA_URL}
              predicates:
                - Path=/bazar-persona/**
              filters:
                - StripPrefix=1
                - PrefixPath=/api
            - id: bazar-chat
              uri: ${BAZAR_CHAT_URL}
              predicates:
                - Path=/bazar-chat/**
              filters:
                - StripPrefix=1
                - PrefixPath=/api
            - id: bazar-chat-ws
              uri: ${BAZAR_CHAT_WS_URL}
              predicates:
                - Path=/ws/bazar-chat/**
              filters:
                - StripPrefix=2
                - PrefixPath=/api
            - id: bazar-storage
              uri: ${BAZAR_STORAGE_URL}
              predicates:
                - Path=/bazar-storage/**
              filters:
                - StripPrefix=1
                - PrefixPath=/api
          default-filters:
            - TokenRelay=
  threads:
    virtual:
      enabled: true
logging:
  level:
    org:
      bazar: ${LOGGING_LEVEL:DEBUG}
      springframework:
        security: ${LOGGING_LEVEL:DEBUG}
        web: ${LOGGING_LEVEL:DEBUG}
management:
  server:
    port: 8090
server:
  port: 8080
  forward-headers-strategy: framework
  reactive:
    session:
      timeout: 7d
      cookie:
        max-age: 30d
